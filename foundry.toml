[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[rpc_endpoints]
elysium_testnet = "https://testnet-rpc.elysium.kinetiq.xyz"
# third-party node (hypedexer), same chain; use as fallback
elysium_testnet_alt = "https://elysium-testnet-rpc.hypedexer.com/"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
