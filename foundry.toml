[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# No global solc pin: src/swap/v2 (Uniswap V2 fork) builds with its original 0.5.16, everything else with 0.8.28.
auto_detect_solc = true
compilation_restrictions = [{ paths = "src/swap/v2/**", version = "=0.5.16" }]
evm_version = "prague" # ArbOS 40+ (Elysium runs 51): needed for EIP-7702
optimizer = true
optimizer_runs = 10_000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[rpc_endpoints]
elysium_testnet = "https://testnet-rpc.elysium.kinetiq.xyz"
# third-party node (hypedexer), same chain; use as fallback
elysium_testnet_alt = "https://elysium-testnet-rpc.hypedexer.com/"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
