<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Neuriio X banner v2</title>
<style>
  /* X banner v2 (user's design): their image + the app's dot grid on the right. 3000x1000. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 3000px; height: 1000px; overflow: hidden; background: #8a7aa0; }
  .banner { position: relative; width: 3000px; height: 1000px; background: url(base.webp) center / cover no-repeat; }
  /* dots (#1b1229, 44px grid like the app at 2x): fade in from the center, strongest on the right */
  .dots {
    position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(27, 18, 41, 0.55) 2.2px, transparent 2.8px) 0 0 / 44px 44px;
    -webkit-mask-image: linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.35) 64%, #000 82%);
            mask-image: linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.35) 64%, #000 82%);
  }
</style>
</head>
<body>
  <div class="banner"><div class="dots"></div></div>
</body>
</html>
